services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:?set TZ in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - database

  n8n:
    image: ${N8N_IMAGE:?set N8N_IMAGE in .env}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${DOMAIN:?set DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}/
      WEBHOOK_URL: https://${DOMAIN:?set DOMAIN in .env}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      TZ: ${TZ:?set TZ in .env}
      GENERIC_TIMEZONE: ${TZ:?set TZ in .env}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database
      - proxy

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/n8n.conf:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      - n8n
    restart: unless-stopped
    networks:
      - proxy

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    networks:
      - proxy

  netdata:
    image: ${NETDATA_IMAGE:?set NETDATA_IMAGE in .env}
    hostname: n8n-vps
    pid: host
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      DO_NOT_TRACK: "1"
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - ./netdata/health.d/cpu.conf:/etc/netdata/health.d/cpu.conf:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    restart: unless-stopped

  rclone:
    image: rclone/rclone:1.70.3
    profiles: ["backup"]
    command: ["serve", "restic", "yadisk:n8n-restic", "--addr", ":8080"]
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    networks:
      - backup
      - backup_egress

volumes:
  postgres_data:
    name: n8n_postgres_data
  n8n_data:
    name: n8n_n8n_data
  letsencrypt:
    name: n8n_letsencrypt
  acme_webroot:
    name: n8n_acme_webroot
  netdata_config:
    name: n8n_netdata_config
  netdata_lib:
    name: n8n_netdata_lib
  netdata_cache:
    name: n8n_netdata_cache

networks:
  database:
    internal: true
  proxy:
  backup:
    name: n8n_backup
    internal: true
  backup_egress:
