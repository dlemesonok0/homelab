name: Deploy n8n with Ansible

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Infisical using GitHub OIDC
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}

      # Temporary diagnostic: prints only whether a key is present, never its value.
      - name: Verify Infisical environment injection
        shell: bash
        run: |
          for key in \
            VPS_HOST VPS_USER VPS_SSH_KEY \
            DOMAIN NTFY_DOMAIN CERTBOT_EMAIL POSTGRES_PASSWORD \
            N8N_ENCRYPTION_KEY N8N_API_KEY NTFY_TOKEN NTFY_USER_PASSWORD_HASH \
            RCLONE_CONFIG_B64 RESTIC_PASSWORD; do
            if [[ -n "${!key:-}" ]]; then
              echo "$key: present"
            else
              echo "$key: MISSING"
            fi
          done

      - name: Install Ansible
        run: pipx install ansible-core==2.17.9

      - name: Configure deployment SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/n8n_deploy
          chmod 600 ~/.ssh/n8n_deploy

      - name: Copy release to VPS
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/n8n_deploy -o StrictHostKeyChecking=accept-new -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "sudo install -d -m 0755 -o \"$VPS_USER\" -g \"\$(id -gn)\" \"$VPS_APP_DIR\""
          tar --exclude-vcs --exclude=.env --exclude=backups -czf /tmp/n8n-release.tar.gz .
          scp -i ~/.ssh/n8n_deploy -o StrictHostKeyChecking=accept-new -P "$VPS_PORT" /tmp/n8n-release.tar.gz "$VPS_USER@$VPS_HOST:/tmp/n8n-release.tar.gz"
          ssh -i ~/.ssh/n8n_deploy -o StrictHostKeyChecking=accept-new -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "tar -xzf /tmp/n8n-release.tar.gz -C \"$VPS_APP_DIR\" && rm -f /tmp/n8n-release.tar.gz"

      - name: Configure and deploy with Ansible
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          secrets_file="$RUNNER_TEMP/infisical-vars.json"
          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import sys

          names = (
              "DOMAIN", "NTFY_DOMAIN", "CERTBOT_EMAIL", "POSTGRES_PASSWORD",
              "N8N_ENCRYPTION_KEY", "N8N_API_KEY", "NTFY_TOKEN", "NTFY_USER_PASSWORD_HASH",
              "RCLONE_CONFIG_B64", "RESTIC_PASSWORD",
          )
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump({"infisical_secrets": {name: os.environ.get(name, "") for name in names}}, output)
          PY
          chmod 600 "$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT
          ansible-playbook -i "$VPS_HOST," -u "$VPS_USER" -e "ansible_port=$VPS_PORT" -e "app_dir=$VPS_APP_DIR" -e "ssh_port=$VPS_PORT" \
            --extra-vars "@$secrets_file" --private-key ~/.ssh/n8n_deploy ansible/playbooks/deploy.yml

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/n8n_deploy -o StrictHostKeyChecking=accept-new -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd \"$VPS_APP_DIR\" && sudo docker compose --env-file .env ps && sudo docker compose --env-file .env logs --tail=100" || true

