---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Mark operational scripts executable
  ansible.builtin.file:
    path: "{{ app_dir }}/scripts/{{ item }}"
    mode: '0755'
  loop:
    - backup.sh
    - restore.sh
    - renew-certificates.sh

- name: Remove superseded bootstrap scripts
  ansible.builtin.file:
    path: "{{ app_dir }}/scripts/{{ item }}"
    state: absent
  loop:
    - bootstrap.sh
    - deploy.sh
    - install-systemd-units.sh
    - write-runtime-env.sh

- name: Write private runtime configuration from controller environment
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Write private rclone configuration for Yandex Disk
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ app_dir }}/rclone.conf"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Write private Netdata ntfy notification configuration
  ansible.builtin.template:
    src: health_alarm_notify.conf.j2
    dest: "{{ app_dir }}/netdata/health_alarm_notify.conf"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install n8n systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - n8n-backup.service
    - n8n-backup.timer
    - n8n-certbot-renew.service
    - n8n-certbot-renew.timer
  notify: Reload systemd

- name: Reload systemd before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Enable n8n scheduled maintenance timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - n8n-backup.timer
    - n8n-certbot-renew.timer

- name: Check for Certbot-managed TLS certificates
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - n8n_letsencrypt:/etc/letsencrypt
      - alpine:3.20
      - sh
      - -c
      - >-
        test -f "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
        && test -f "/etc/letsencrypt/renewal/{{ item }}.conf"
        && grep -Fqx "cert = /etc/letsencrypt/live/{{ item }}/cert.pem" "/etc/letsencrypt/renewal/{{ item }}.conf"
        && grep -Fqx "privkey = /etc/letsencrypt/live/{{ item }}/privkey.pem" "/etc/letsencrypt/renewal/{{ item }}.conf"
        && grep -Fqx "chain = /etc/letsencrypt/live/{{ item }}/chain.pem" "/etc/letsencrypt/renewal/{{ item }}.conf"
        && grep -Fqx "fullchain = /etc/letsencrypt/live/{{ item }}/fullchain.pem" "/etc/letsencrypt/renewal/{{ item }}.conf"
  loop:
    - "{{ domain }}"
    - "{{ ntfy_domain }}"
  register: certificate_checks
  changed_when: false
  failed_when: false

- name: Remove incomplete certificate state before first issuance
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - n8n_letsencrypt:/etc/letsencrypt
      - alpine:3.20
      - sh
      - -c
      - >-
        find /etc/letsencrypt/live /etc/letsencrypt/archive -mindepth 1 -maxdepth 1
        -type d \( -name '{{ item.item }}' -o -name '{{ item.item }}-[0-9]*' \) -exec rm -rf {} +
        && find /etc/letsencrypt/renewal -mindepth 1 -maxdepth 1
        -type f \( -name '{{ item.item }}.conf' -o -name '{{ item.item }}-[0-9]*.conf' \) -delete
  loop: "{{ certificate_checks.results }}"
  when: item.rc != 0
  changed_when: true

- name: Create temporary certificates for first nginx start
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - n8n_letsencrypt:/etc/letsencrypt
      - alpine:3.20
      - sh
      - -c
      - >-
        apk add --no-cache openssl >/dev/null && mkdir -p /etc/letsencrypt/live/{{ item.item }}
        && openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN={{ item.item }}
        -keyout /etc/letsencrypt/live/{{ item.item }}/privkey.pem
        -out /etc/letsencrypt/live/{{ item.item }}/fullchain.pem
  loop: "{{ certificate_checks.results }}"
  when: item.rc != 0

- name: Start application and monitoring stack
  ansible.builtin.command: docker compose --env-file .env up -d --remove-orphans postgres n8n ntfy nginx netdata
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Remove temporary certificates before first Certbot request
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - n8n_letsencrypt:/etc/letsencrypt
      - alpine:3.20
      - rm
      - -rf
      - "/etc/letsencrypt/live/{{ item.item }}"
  loop: "{{ certificate_checks.results }}"
  when: item.rc != 0
  changed_when: true

- name: Obtain or renew Let's Encrypt certificates
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env
      - run
      - --rm
      - --no-deps
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --email
      - "{{ certbot_email }}"
      - --agree-tos
      - --no-eff-email
      - --cert-name
      - "{{ item.item }}"
      - --keep-until-expiring
      - -d
      - "{{ item.item }}"
  loop: "{{ certificate_checks.results }}"
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Verify Certbot created the managed certificates
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - n8n_letsencrypt:/etc/letsencrypt
      - alpine:3.20
      - sh
      - -c
      - >-
        test -f "/etc/letsencrypt/live/{{ item.item }}/fullchain.pem"
        && test -f "/etc/letsencrypt/renewal/{{ item.item }}.conf"
  loop: "{{ certificate_checks.results }}"
  changed_when: false

- name: Reload nginx with current certificate
  ansible.builtin.command: docker compose --env-file .env exec -T nginx nginx -s reload
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Wait for Compose health checks
  ansible.builtin.command: docker compose --env-file .env up -d --wait --wait-timeout 180 postgres n8n ntfy nginx netdata
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Provision n8n error notification workflow
  ansible.builtin.command: docker compose --env-file .env exec -T n8n node /opt/provision/provision-n8n-error-workflow.mjs
  args:
    chdir: "{{ app_dir }}"
  changed_when: true
  no_log: true
  when:
    - infisical_secrets.N8N_API_KEY is defined
    - infisical_secrets.N8N_API_KEY | length > 0

- name: Show Compose state
  ansible.builtin.command: docker compose --env-file .env ps
  args:
    chdir: "{{ app_dir }}"
  changed_when: false

